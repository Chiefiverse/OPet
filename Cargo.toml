[workspace]
resolver = "2"
members = ["crates/petcore", "crates/overlay-wayland", "crates/opet-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Chiefiverse/OPet"
rust-version = "1.86"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

petcore = { path = "crates/petcore" }
overlay-wayland = { path = "crates/overlay-wayland" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
