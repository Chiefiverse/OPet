[workspace]
resolver = "2"
members = [
    "crates/petcore",
    "crates/overlay-common",
    "crates/overlay-report",
    "crates/overlay-wayland",
    "crates/overlay-win32",
    "crates/petstore",
    "crates/opet-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Chiefiverse/OPet"
rust-version = "1.86"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 钉死 0.11.0：0.11.1 要求 rustc 1.88，而本仓库声明的 MSRV 是 1.86。
# resolver=2 不会自动按 MSRV 选版，所以只能显式钉（升级时连同 rust-version 一起改）。
sha2 = "=0.11.0"
# ⚠️ 下面三个都**不进** petcore（硬约束 #8：内核无 IO、无墙钟）。
# `cargo tree -p petcore -e normal` 里出现任何一个就说明分层被破坏了。
rusqlite = { version = "0.37", features = ["bundled"] }
getrandom = "0.3"
# 本项目**第一次**真加依赖（视觉重做 V2 / 设计书 §6.1.4 判据③的 (b) 路线）。
# D8 allowlist 逐条核过，四个 crate 都读了 `~/.cargo/registry/src/**/LICENSE*` 原文，不是凭记忆：
#   ab_glyph 0.2.32 = Apache-2.0 · ab_glyph_rasterizer 0.1.10 = Apache-2.0
#   owned_ttf_parser 0.25.1 = Apache-2.0 · ttf-parser 0.25.1 = "MIT OR Apache-2.0"
# 全部落在 allowlist（BSD/MIT/Apache-2.0/LGPL-3）内，**GPL-2-only 那个排除项一个都没沾**。
# 钉死版本 + 关掉默认特性：① 字形栅格化结果**就是卡片像素**，换版本等于换 hinting ⇒ 出图过眼
# 门禁要全部重跑；② 子集里没有 `gvar` 表，`variable-fonts`/`gvar-alloc` 用不上，多开只是多代码。
ab_glyph = { version = "=0.2.32", default-features = false, features = ["std"] }
# 本项目**第二次**真加依赖（设计书 §9.2 第 19 条 = 设置页那个 TOML writer）。
# D8 allowlist 逐条核过，锁定的八个 crate 都读了 `~/.cargo/registry/src/**/LICENSE*` 原文，不是凭记忆：
#   toml_edit 0.25.17 · toml_datetime 1.1.2 · toml_parser 1.1.5 · toml_writer 1.1.3
#   indexmap 2.14.2 · hashbrown 0.17.1 · equivalent 1.0.3 = 全 "MIT OR Apache-2.0"
#   winnow 1.0.4 = MIT-only
# 全部落在 allowlist（BSD/MIT/Apache-2.0/LGPL-3）内，**GPL-2-only 那个排除项一个都没沾**；
# 每个目录都 `ls` 过 ⇒ 只有 LICENSE-APACHE / LICENSE-MIT 两份，**没有** EXCEPTION / 附加条款文件，
# Apache 那份读的是正文（第 3 行 = 规范 URL、第 66 行 = "2. Grant of Copyright License"、
# 末尾 Appendix 的版权行填的是 "Individual contributors"）= 标准 2.0，不是带改动的版本。
# MSRV 逐个查过：七个 = 1.85，winnow = 1.65、equivalent = 1.6 ⇒ 都不高于本仓库声明的 1.86，
# **不需要抬 MSRV**。
# **钉死版本**的理由与 ab_glyph 那条同族但更直接：writer 写出的**字节本身**就是"带注释的
# config.toml 写回后注释仍在"那条判据的宾语 ⇒ 换版本 = 换写出的格式 = 那条往返测试要全部重跑。
toml_edit = "=0.25.17"
# 本项目**第三次**真加依赖（M5 Windows 第一批 / 设计书 §3.7）。
# ⚠️ **这一条只给 `overlay-win32`，而且是 target-gated**（`[target.'cfg(windows)'.dependencies]`），
# 不是顺手写在 `[dependencies]` 里：写在通用那一栏，Linux 宿主也能 `use windows_sys::…`
# （这 crate 在非 Windows 上编出一个空壳而不是报错）⇒ 那一行要等**链接**才炸，
# 而"链接才炸"在本项目就是"门禁看不见"（同 `--cell` 假开关那一族：错误必须发生在最早可能的那刻）。
# D8 allowlist 逐条核过，两个 crate 都读了 `.crate` 解包后的许可证**原文**（不是凭记忆，也不是 grep 文件名）：
#   windows-sys 0.61.2 = "MIT OR Apache-2.0" · windows-link 0.2.1 = "MIT OR Apache-2.0"（它唯一的依赖）
# 全部落在 allowlist（BSD/MIT/Apache-2.0/LGPL-3）内，**GPL-2-only 那个排除项一个都没沾**；
# 两个目录都 `ls` 过 ⇒ 只有 `license-apache-2.0` / `license-mit` / `readme.md` 三份 + 源码，
# **没有** EXCEPTION / 附加条款文件，而且**没有 `NOTICE` 文件**（Apache-2.0 那条"第 4(d) 项要随附
# 声明文件"的义务因此是空的 ⇒ 我们分发 `.exe` 时不必再摊任何第三方声明）。
# Apache 那份读的是正文：201 行、`APPENDIX` 在第 178 行、末尾版权行填 "Copyright (c) Microsoft Corporation"
# ⇒ 标准 2.0，不是带改动的版本。MIT 那份的持有人同样是 Microsoft Corporation。
# MSRV 逐个查过：两个都是 **1.71** ⇒ 不高于本仓库声明的 1.86，**不需要抬 MSRV**。
# 特性开九个（`Win32_Foundation` / `Graphics_Gdi` / `UI_WindowsAndMessaging` / `UI_HiDpi` /
# `System_Threading` / `System_ProcessStatus` / `System_LibraryLoader` /
# `UI_Input_KeyboardAndMouse` / `System_Security`）：
# 这张清单逐个在 `Cargo.toml` 里存在过（`grep -c` = 9），
# 而且九个都只指向自己那一层的父命名空间（`Win32_UI_HiDpi = ["Win32_UI"]` 那种）⇒ **互不牵连**，
# 多开一个只是多编译。`default = []`（第 280 行实测）⇒ 不写 `default-features = false`，
# 那是一条永远不改变任何东西的写法 = 假开关。
# ⚠️ **后三个是第 8 步加上的，不是第 7 步数错**：
# `GetModuleHandleW`（`RegisterClassExW`/`CreateWindowExW` 要的 `HINSTANCE`）与
# `SetCapture`/`ReleaseCapture`（拖拽抓鼠 + `WM_CAPTURECHANGED` 那条 P0 的另一半）
# 在第 7 步那份"六个特性"的清单里**没有来源**，因为那时还没写 `window.rs`。
# 第三个 `Win32_Security` 尤其不是"顺手多开"：**它是 `CreateWaitableTimerExW` 的门控**
# （实测 `grep -B1` = `#[cfg(feature = "Win32_Security")]`，因为它的第一个参数是
# `*const SECURITY_ATTRIBUTES`）⇒ 不开它，60 Hz 那个高精度定时器**根本不存在**，
# 而报错是一句"cannot find function"，看不出跟"安全"有什么关系。
# ⇒ **登记这一格**：第 7 步那句"六个"当时的正确读法是
# "**宿主可测的那五个文件**要六个"，而窗口层要的从来不止六个。
# ⚠️ **第 5 步那份 11 项 DLL 表不是第 9 步的白名单**（这条差点被读成"白名单照旧"）：
# 它测的是 `hello-win32`，**那时还没有 `window.rs`** ⇒ 逐字 = KERNEL32 / ntdll /
# api-ms-win-core-synch / 8 项 api-ms-win-crt-∗（`scratch/win32_dlls_step5_2026-11-21.txt`）。
# 窗口层一接上，`USER32.dll`（消息/类/ULW/捕获）与 `GDI32.dll`（`CreateDIBSection`）
# **必然新进表**（这两个是从 windows-sys 的 `link!("user32.dll" …)` 定义处读出来的，不是猜的），
# 而第九个特性 `Win32_Security` 只多给一个**类型**、函数仍在 `kernel32.dll` ⇒ 它不动表。
# ⇒ **第 9 步那条 `objdump -p` 白名单必须在第 8 步完成后重测**，拿第 5 步那 11 项当门禁
# 会把一份其实正常的 `.exe` 判成"多带了系统依赖"。
# **钉死版本**的理由与上面两条同族但落在另一处：这些是 **FFI 签名**，我们那些 `unsafe` 块是按
# 0.61 的函数形状写的 ⇒ 换次版本可能改签名，而**只有交叉编译会看见**（宿主根本不走这条路）。
# 不 `=` 住，症状就是"某天 CI 突然编不过，而没人改过 Windows 那侧"。
# 0.61 的依赖面也是选它而不是 0.59 的理由：0.61 只拖 `windows-link`，0.59 拖 `windows-targets`
# ⇒ 八个架构的扇出（`Cargo.lock` 里 0.59.0 那份是别人在 Windows 上的传递依赖，不在我们的关键路径上）。
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security",
] }

petcore = { path = "crates/petcore" }
petstore = { path = "crates/petstore" }
overlay-common = { path = "crates/overlay-common" }
# 报表与库扫描层（M7-b 前置上提）：`petcore` + `petstore` + `overlay-common` 的下游，零平台绑定。
# 它不能并进 overlay-common（那边只允许 petcore + 排版那几个，`rusqlite` 一进来就破"零 IO"），
# 也不能并进 petstore（那一层不该知道 `menu::fit_to` 与词表）。
overlay-report = { path = "crates/overlay-report" }
overlay-wayland = { path = "crates/overlay-wayland" }
# 图集解码。**版本收在 workspace 一处**的理由与 overlay-common 的立身之本同一条：
# 编解码器换一版 = 换一份解码字节 = 各平台屏上的像素漂移，而没有任何门禁会替你说"两边不同了"。
image-webp = "0.2.4"
# 本项目**第四次**真加依赖（PAID-EDITION §3.5-d 音频基建 / §5.1-3 翻向后的落地）。
# ⚠️ **只有 overlay-win32 链它**：Linux 侧真机实测 rodio→cpal→pipewire-alsa 路径样本不流动
# （PipeWire sink-input 在册、100% 音量、非 corked，而屏上无声；同一文件 paplay 大声）
# ⇒ `overlay-wayland/src/audio.rs` 改走 **paplay 子进程**（失败退 pw-play），零 Rust 音频依赖；
# Windows 侧 rodio/WASAPI 正常，保留。**不进 petcore / overlay-common**
# （D12/D13：内核不碰设备、共用层不链平台 FFI——rodio→cpal→alsa-sys/windows 在传递图里）。
# D8 allowlist 逐条核过（`cargo tree -e normal -p overlay-win32 --target x86_64-pc-windows-gnu`，
# 88 个 crate，每个都 `grep '^license' Cargo.toml`）。结果：
#   标准位（BSD/MIT/Apache-2.0/ISC）：rodio "MIT OR Apache-2.0" · cpal "Apache-2.0"
#     alsa "Apache-2.0/MIT" · alsa-sys "MIT" · windows 0.62 "MIT OR Apache-2.0"
#     dasp_sample "MIT OR Apache-2.0" · encoding_rs "(Apache-2.0 OR MIT) AND BSD-3-Clause"
#     num-traits/num-bigint/num-integer/num-rational "MIT OR Apache-2.0"
#     lazy_static/arrayvec/bitflags/autocfg/rustversion/scopeguard/walkdir "MIT"/"Apache-2.0"
#   LGPL-3（已在册）：无新条目。
#   **MPL-2.0（新增 allowlist 项）**：symphonia 家族六枚——
#     symphonia · symphonia-core · symphonia-codec-vorbis · symphonia-format-ogg
#     symphonia-metadata · symphonia-utils-xiph，全 = "MPL-2.0"（Cargo.toml 声明，
#     目录内无 LICENSE 文件，许可证原文见 https://mozilla.org/MPL/2.0/）。
#     ⇒ **MPL-2.0 入 allowlist 的论证**：文件级 copyleft（弱于 LGPL-3 的库级、更弱于已在册的
#     AGPL-3 项目主体），我们不改其源 ⇒ 义务仅 §3.3"告知源码获取途径"；与专有 EULA 的 `.petpack`
#     资产无传染（不同作品、不共享文件）；分发 `.exe` 时附一行 NOTICE（归 M8 发布面）。
#   GPL-2-only（排除项）：**零**。
#   GPL-3/Apache-2.0 dual：无新条目（项目主体已是 AGPL-3）。
# 特性选择 = `default-features = false, features = ["vorbis", "playback"]`：
#   · `playback` = 真出声（带进 cpal），不开则只有解码无输出 = 假功能。
#   · `vorbis` = OGG/Vorbis 解码（经 symphonia），是 §5.1-3 拍板"仅本地预录 ogg"唯一需要的格式。
#   · 不开 `mp3`/`flac`/`wav`/`aac`/`mp4`/`recording`/`noise`/`dither`/`tracing` = 最小面。
#   · 不开 `default`（0.23 的 default = 全格式 + dither + noise，链多 13 个 crate 且含 minimp3）。
# **钉死版本**的理由同 image-webp 那条：解码器换版 = 同一份 .ogg 的 PCM 输出可能变（重采样
# 或 dither 实现细节），而"开机第一声"那格只有人耳判。
rodio = { version = "0.23", default-features = false, features = ["vorbis", "playback"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
