[workspace]
resolver = "2"
members = ["crates/petcore", "crates/overlay-wayland", "crates/petstore", "crates/opet-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Chiefiverse/OPet"
rust-version = "1.86"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 钉死 0.11.0：0.11.1 要求 rustc 1.88，而本仓库声明的 MSRV 是 1.86。
# resolver=2 不会自动按 MSRV 选版，所以只能显式钉（升级时连同 rust-version 一起改）。
sha2 = "=0.11.0"
# ⚠️ 下面三个都**不进** petcore（硬约束 #8：内核无 IO、无墙钟）。
# `cargo tree -p petcore -e normal` 里出现任何一个就说明分层被破坏了。
rusqlite = { version = "0.37", features = ["bundled"] }
getrandom = "0.3"
# 本项目**第一次**真加依赖（视觉重做 V2 / 设计书 §6.1.4 判据③的 (b) 路线）。
# D8 allowlist 逐条核过，四个 crate 都读了 `~/.cargo/registry/src/**/LICENSE*` 原文，不是凭记忆：
#   ab_glyph 0.2.32 = Apache-2.0 · ab_glyph_rasterizer 0.1.10 = Apache-2.0
#   owned_ttf_parser 0.25.1 = Apache-2.0 · ttf-parser 0.25.1 = "MIT OR Apache-2.0"
# 全部落在 allowlist（BSD/MIT/Apache-2.0/LGPL-3）内，**GPL-2-only 那个排除项一个都没沾**。
# 钉死版本 + 关掉默认特性：① 字形栅格化结果**就是卡片像素**，换版本等于换 hinting ⇒ 出图过眼
# 门禁要全部重跑；② 子集里没有 `gvar` 表，`variable-fonts`/`gvar-alloc` 用不上，多开只是多代码。
ab_glyph = { version = "=0.2.32", default-features = false, features = ["std"] }
# 本项目**第二次**真加依赖（设计书 §9.2 第 19 条 = 设置页那个 TOML writer）。
# D8 allowlist 逐条核过，锁定的八个 crate 都读了 `~/.cargo/registry/src/**/LICENSE*` 原文，不是凭记忆：
#   toml_edit 0.25.17 · toml_datetime 1.1.2 · toml_parser 1.1.5 · toml_writer 1.1.3
#   indexmap 2.14.2 · hashbrown 0.17.1 · equivalent 1.0.3 = 全 "MIT OR Apache-2.0"
#   winnow 1.0.4 = MIT-only
# 全部落在 allowlist（BSD/MIT/Apache-2.0/LGPL-3）内，**GPL-2-only 那个排除项一个都没沾**；
# 每个目录都 `ls` 过 ⇒ 只有 LICENSE-APACHE / LICENSE-MIT 两份，**没有** EXCEPTION / 附加条款文件，
# Apache 那份读的是正文（第 3 行 = 规范 URL、第 66 行 = "2. Grant of Copyright License"、
# 末尾 Appendix 的版权行填的是 "Individual contributors"）= 标准 2.0，不是带改动的版本。
# MSRV 逐个查过：七个 = 1.85，winnow = 1.65、equivalent = 1.6 ⇒ 都不高于本仓库声明的 1.86，
# **不需要抬 MSRV**。
# **钉死版本**的理由与 ab_glyph 那条同族但更直接：writer 写出的**字节本身**就是"带注释的
# config.toml 写回后注释仍在"那条判据的宾语 ⇒ 换版本 = 换写出的格式 = 那条往返测试要全部重跑。
toml_edit = "=0.25.17"

petcore = { path = "crates/petcore" }
petstore = { path = "crates/petstore" }
overlay-wayland = { path = "crates/overlay-wayland" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
